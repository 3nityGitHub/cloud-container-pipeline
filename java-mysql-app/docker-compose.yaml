services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: team-db
      MYSQL_USER: admin
      MYSQL_PASSWORD: ${DB_PWD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
  
  java-app:
    image: localhost:8085/java-mysql-app:1.0
    ports:
      - "8080:8080"
    environment:
      DB_SERVER: mysql
      DB_USER: ${DB_USER}
      DB_PWD: ${DB_PWD}
      DB_NAME: ${DB_NAME}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
